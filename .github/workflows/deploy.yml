name: CI/CD Pipeline with Blue-Green Deployment

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest backend/

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy-blue:
    needs: build
    runs-on: ubuntu-latest
    environment: blue

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Blue Environment
        run: |
          echo "Deploying to blue environment"

          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          # Example deployment command
          # docker stop app-blue || true
          # docker rm app-blue || true
          # docker run -d --name app-blue -p 8080:8000 \
          #   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy-green:
    needs: deploy-blue
    runs-on: ubuntu-latest
    environment: green

    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to Green Environment
        run: |
          echo "Deploying to green environment"

          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          # Example deployment command
          # docker stop app-green || true
          # docker rm app-green || true
          # docker run -d --name app-green -p 8081:8000 \
          #   ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  promote:
    needs: deploy-green
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Promote Green to Production
        run: |
          echo "Switching traffic to green environment"

